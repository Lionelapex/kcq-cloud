<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>KCQ Cloud</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 10px; display: grid; gap: 8px; }
    input { padding: 8px; font: inherit; width: 100%; box-sizing: border-box; }
    button { padding: 6px 10px; font: inherit; cursor: pointer; }
    .row { display: flex; gap: 6px; }
    .card { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px; }
    .card small { color: #6b7280; }
    .q { margin: 4px 0; font-weight: 600; }
    .a { margin: 4px 0; color: #166534; font-size: 16px; font-weight: 700; }
    .u { margin: 4px 0; color: #b45309; }
    .g { margin: 4px 0; color: #1d4ed8; font-weight: 600; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <div class="row">
    <button id="selection">Use selected text</button>
    <button id="refresh">Refresh</button>
  </div>
  <input id="query" placeholder="Type the first words of the question..." autofocus>
  <div id="status" class="muted"></div>
  <div id="results"></div>
  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
